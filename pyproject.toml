[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynawo-notebooks"
version = "0.1.0"
description = "Tools and API for Dynawo and OpenModelica integration, extracted from dynawo-notebooks."
requires-python = ">=3.9"
license = { file = "LICENSE" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "lxml>=4.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
dynawo-xml-parser = "dynawo_notebooks.Scripts.utils.get_init_dict:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[project.urls]
Homepage = "https://github.com/dynawo/dynawo-notebooks"
Repository = "https://github.com/dynawo/dynawo-notebooks"

[tool.hatch.build.targets.wheel]
packages = ["src/dynawo_notebooks"]